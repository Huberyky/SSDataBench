
# Content configuration with conditioning inputs.
context: >
  population of adolescents enrolled in grades 7–12 during the 1994–95 
  school year in the United States.

population_context:
  reference_year: 2018
  age_range: [20, 45]
  region: U.S.

input_variables:
  gender:
    type: static
    description: Sex
    domain: Demography
    allowed:
      - female
      - male

  birth_year:
    type: static
    description: Birth Year
    domain: Demography
    allowed:
      type: numeric
      min: 1974
      max: 1983

  race:
    type: static
    description: ethnic or racial identity
    domain: Demography
    allowed:
      - non-Hispanic white
      - black
      - native american
      - asian
      - hispanic
      - others

  siblings:
    type: static
    description: number of siblings
    domain: Demography
    allowed:
      type: numeric
      min: 0
      max: 5
      special:
      - 6 or above

  mother_edu:
    type: static
    description: Mother's education
    domain: Demography
    allowed:
      - high school or below
      - some college
      - BA or above

  father_edu:
    type: static
    description: Father's education
    domain: Demography
    allowed:
      - high school or below
      - some college
      - BA or above

  migrant:
    type: static
    description: Indicates whether the respondent was born in the United States
    domain: Demography
    allowed:
      - born in U.S.
      - immigrant

output_variables:
  marital_status:
    type: sequential
    description: marital status
    domain: Marriage
    allowed:
      - cohabitation
      - divorced
      - married
      - single
      - widowed

  ever_sex_sequential:
    type: sequential
    description: Ever had sex
    domain: Marriage
    allowed:
      - never sex
      - ever sex

  children_number:
    type: sequential
    description: Number of children 
    domain: Marriage
    allowed:
      type: numeric
      min: 0
      max: 5
      special: 
      - 6 or above
  education:
    type: sequential
    description: Level of education attained
    domain: SES
    allowed:
      - some college
      - high school or below
      - BA or above

  occupation:
    type: sequential
    description: Occupation
    domain: SES
    allowed:
      - Legislators, senior officials and managers
      - Professionals
      - Technicians and associate professionals
      - Clerks
      - Service workers and shop and market sales workers
      - Skilled agricultural and fishery workers
      - Craft and related trades workers
      - Plant and machine operators and assemblers
      - Elementary occupations
      - Armed forces
      - unemployed


  income:
    type: sequential
    description: Personal annual income
    domain: SES
    allowed:
      type: numeric
      min: 0
      max: 999999


  employment:
    type: sequential
    description: Current job status
    domain: SES
    allowed:
      - unemployed
      - employed

  self_rated_health:
    type: static
    description: Self-rated health status
    domain: Health
    allowed:
      - excellent
      - very good
      - good
      - fair
      - poor

  self_rated_depression:
    type: static
    description: Self-rated depression, with higher scores indicating stronger depressive feelings
    domain: Health
    allowed:
      type: numeric
      min: -3
      max: 6



  political_orientation:
    type: static
    description: political ideology
    domain: Attitudes
    allowed:
      - very conservative
      - conservative
      - middle-of-the-road
      - liberal
      - very liberal

  hardwork:
    type: static
    description: Belief about hard work
    domain: Ability
    allowed:
      - strongly disagree
      - disagree
      - neither agree nor disagree
      - agree
      - strongly agree

  interpersonal:
    type: static
    description: Frequency of interpersonal interactions
    domain: Ability
    allowed:
      - never
      - few times
      - once a week
      - almost everyday

postprocess_modules:
  - age_at_first_marriage
  - age_at_first_sex
  - ever_divorced
  - age_started_work
  - child_number
  - occupation_30_40
  - mean_income_30_40
  - highest_education

original_data:
  source: "Add Health"
  description: >
    National longitudinal study of U.S. adolescents in grades 7–12 during the 1994–95
    school year, followed into adulthood across multiple waves.
  file: "./real_data/dataset/addhealth.csv"

