# Default generation parameters.
llm_parameters:
  model: "gpt-3.5-turbo"
  temperature: 1.0
  top_p: 1.0
  max_completion_tokens: 3000

threading:
  default_max_workers: 10
  max_workers_limit: 10

generation:
  # output_directory provided by calling script
  # num_profiles provided by calling script
  max_retries: 3
  retry_delay: 1.0
  progress_report_interval: 10
