# Content configuration with conditioning inputs.
context: >
  population in the United States in 2000.

population_context:
  reference_year: 2000
  age_range: [0, 90]
  region: United States


input_variables:
  birth_year:
    type: static
    description: Year of birth
    domain: Demography
    allowed:
      type: numeric
      min: 1905
      max: 2000

  age:
    type: static
    description: Age
    domain: Demography
    allowed:
      type: numeric
      min: 0
      max: 90

  gender:
    type: static
    description: Sex
    domain: Demography
    allowed:
      - Female
      - Male

  race:
    type: static
    description: Racial/ethnic identification
    domain: Demography
    allowed: 
      - Non-Black, Non-Hispanic
      - Hispanic
      - Black

  immigrant_status:
    type: static
    description: Immigration status
    domain: Demography
    allowed: 
      - Non-immigrant
      - Immigrant

output_variables:
  marital_status:
    type: static
    description: Marital status
    domain: Marriage
    allowed:
      - Married
      - Divorced/widowed
      - Single
  
  child_number:
    type: static
    description: Number of Child ever born
    domain: Marriage
    allowed:
      type: numeric
      min: 0
      max: 12

  age_first_childbirth:
    type: static
    description: Age at first childbirth
    domain: Marriage
    allowed:
      type: numeric
      min: 12
      max: 90
      special:
        - No Child

  education:
    type: static
    description: Educational attainment
    domain: SES
    allowed:
      - Less than high school
      - High school
      - College and above

  occupation:
    type: static
    description: Occupation
    domain: SES
    allowed:
      - Managerial Occupations
      - Professional Specialty Occupations
      - Technicians and Related Support Occupations
      - Sales Occupations
      - Clerical and Administrative Support Occupations
      - Service Occupations
      - Farming, Forestry, and Fishing Occupations
      - Precision Production, Craft, and Repair Occupations
      - Operators, Fabricators, and Laborers
      - Military Occupations
      - Unemployed

  income:
    type: static
    description: Total personal income last year
    domain: SES
    allowed:
      type: numeric
      min: 0
      max: 1000000

  health_work_difficulty:
    type: static
    description: Whether respondents have any lasting physical or mental health condition that causes difficulty working
    domain: Health
    allowed:
      - Health affects work
      - Health doesn't affect work

  cognitive_difficulty:
    type: static
    description: Whether the respondent has cognitive difficulties
    domain: Health
    allowed:
      - Has cognitive difficulty
      - No cognitive difficulty

original_data:
  source: "ACS2000"
  description: >
    The U.S. Census in 2000 of 5% sample, which samples 5% of the whole U.S. population in 2000. 
  file: "./real_data/acs2000.csv"
