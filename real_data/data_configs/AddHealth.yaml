
# Content configuration with conditioning inputs.
context: >
  representative population of adolescents enrolled in grades 7–12 during the 1994–95 
  school year in the United States.

population_context:
  reference_year: 2018
  age_range: [35, 44]
  region: U.S.

input_variables:
  gender:
    type: static
    description: Sex
    domain: Demography
    allowed:
      - female
      - male

  birth_year:
    type: static
    description: Birth Year
    domain: Demography
    allowed:
      type: numeric
      min: 1974
      max: 1983

  race:
    type: static
    description: ethnic or racial identity
    domain: Demography
    allowed:
      - non-Hispanic white
      - black
      - native american
      - asian
      - hispanic
      - others

  siblings:
    type: static
    description: number of siblings
    domain: Demography
    allowed:
      type: numeric
      min: 0
      max: 5
      special:
      - 6 or above

  mother_edu:
    type: static
    description: Mother's education
    domain: Demography
    allowed:
      - high school or below
      - some college
      - BA or above

  father_edu:
    type: static
    description: Father's education
    domain: Demography
    allowed:
      - high school or below
      - some college
      - BA or above

  migrant:
    type: static
    description: Indicates whether the respondent was born in the United States
    domain: Demography
    allowed:
      - born in U.S.
      - immigrant

output_variables:
  ever_married:
    type: static
    description: Marriage or not lifetime
    domain: Marriage
    allowed:
      - never married
      - ever married

  ever_married_sequential:
    type: sequential
    description: Marriage or not lifetime
    domain: Marriage
    allowed:
      - never married
      - ever married

  ever_sex:
    type: static
    description: Ever had sex
    domain: Marriage
    allowed:
      - never sex
      - ever sex

  age_at_first_sex:
    type: static
    description: age at first sexual intercourse
    domain: Marriage
    allowed:
      type: numeric
      min: 15
      max: 31
      special:
      - never sex


  age_started_work:
    type: static
    description: Age when respondent first started working for pay
    domain: SES
    allowed:
      type: numeric
      min: 18
      max: 31

  ever_divorced:
    type: static
    description: Divorced or not lifetime
    domain: Marriage
    allowed:
      - never divorced
      - ever divorced
      - never married

  ever_divorced_sequential:
    type: sequential
    description: Divorced or not lifetime
    domain: Marriage
    allowed:
      - never divorced
      - ever divorced
      - never married

  age_at_first_marriage:
    type: static
    description: Age first got married
    domain: Marriage
    allowed:
      type: numeric
      min: 15
      max: 26
      special: 
      - never married

  age_at_first_divorce:
    type: static
    description: Age first got divorced
    domain: Marriage
    allowed:
      type: numeric
      min: 18
      max: 25
      special: 
      - never divorced
      - never married

  child_number:
    type: static
    description: Total number of live births
    domain: Marriage
    allowed:
      type: numeric
      min: 0
      max: 6
      special:
        - 7 or more

  self_rated_health:
    type: static
    description: Self-rated health status
    domain: Health
    allowed:
      - excellent
      - very good
      - good
      - fair
      - poor

  self_rated_depression:
    type: static
    description: Self-rated depression, with higher scores indicating stronger depressive feelings
    domain: Health
    allowed:
      type: numeric
      min: -3
      max: 6

  highest_education:
    type: static
    description: Highest level of education attained
    domain: SES
    allowed:
      - some college
      - high school or below
      - BA or above

  education:
    type: sequential
    description: Level of education attained
    domain: SES
    allowed:
      - some college
      - high school or below
      - BA or above

  occupation:
    type: sequential
    description: Occupation
    domain: SES
    allowed:
      - Legislators, senior officials and managers
      - Professionals
      - Technicians and associate professionals
      - Clerks
      - Service workers and shop and market sales workers
      - Skilled agricultural and fishery workers
      - Craft and related trades workers
      - Plant and machine operators and assemblers
      - Elementary occupations
      - Armed forces
      - unemployed

  occupation_30_40:
    type: static
    description: Main occupation between age 30 to 40
    domain: SES
    allowed:
      - Legislators, senior officials and managers
      - Professionals
      - Technicians and associate professionals
      - Clerks
      - Service workers and shop and market sales workers
      - Skilled agricultural and fishery workers
      - Craft and related trades workers
      - Plant and machine operators and assemblers
      - Elementary occupations
      - Armed forces
      - unemployed

  income:
    type: sequential
    description: Personal annual income
    domain: SES
    allowed:
      type: numeric
      min: 0
      max: 199999
      special:
      - 200000 or above

  mean_income_30_40:
    type: static
    description: Average personal annual income between age 30 to 40
    domain: SES
    allowed:
      type: numeric
      min: 0
      max: 199999
      special:
      - 200000 or above

  employment:
    type: sequential
    description: Current job status
    domain: SES
    allowed:
      - unemployed
      - employed

  political_orientation:
    type: static
    description: political ideology
    domain: Attitudes
    allowed:
      - very conservative
      - conservative
      - middle-of-the-road
      - liberal
      - very liberal

  hardwork:
    type: static
    description: Belief about hard work
    domain: Ability
    allowed:
      - strongly disagree
      - disagree
      - neither agree nor disagree
      - agree
      - strongly agree

  interpersonal:
    type: static
    description: Frequency of interpersonal interactions
    domain: Ability
    allowed:
      - never
      - few times
      - once a week
      - almost everyday

original_data:
  source: "Add Health"
  description: >
    National longitudinal study of U.S. adolescents in grades 7–12 during the 1994–95
    school year, followed into adulthood across multiple waves.
  file: "addhealth_1994_2018"

