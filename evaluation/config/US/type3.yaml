# ================================================
# LEVEL 3 — Bootstrap Regression Comparison Config
# ================================================
# Compare regression coefficients between real and simulated data
# across multiple outcome variables and model types.
# -----------------------------------------------

# === Input Files ===
real_csv: "/home/yx5888/Workspace/AI4SS_Evaluation_local/Simulated_modified/sampled_inputs_gpt-4_temp1.0_top1.0.csv"
sim_csv:  "/home/yx5888/Workspace/AI4SS_Evaluation_local/Simulated_modified/sim_profiles_gpt-4_temp1.0_top1.0.csv"

# === Output Directory ===
out_dir: "./1111"

# === Model Types ===
# One model type per response variable.
#   ols     → linear regression (continuous outcome)
#   logit   → logistic regression (binary outcome)
#   mnlogit → multinomial logistic regression (categorical outcome)
model_type:
  - ols
  - ols
  - ols
  - ols
  - ols
  - ols
  - ols
  - ols
  - ols
  - ols
# === Response Variables ===
# Each variable can specify:
#   name: friendly display name (used in plots or summaries)
#   type: "numeric" or "categorical"
#   value_map: optional dictionary to map labels to numbers
#   drop_values: optional list of invalid values to exclude
response:
      
  physical_health:
    type: numeric
    description: SF-12 score of physical health summary score, higher score indicates higher level of physical health
    domain: Health
    allowed:
      type: numeric
      min: 0
      max: 80

  mental_health:
    type: numeric
    description: SF-12 score of mental health summary score, higher score indicates higher level of mental health
    domain: Health
    allowed:
      type: numeric
      min: 0
      max: 80

  general_health:
    type: numeric
    description: SF-12 general health
    domain: Health
    allowed:
      type: numeric
      min: 1
      max: 5

  depression:
    type: numeric
    description: Self-rated depression based on CESD, higher score indicates higher level of depression
    domain: Health
    allowed:
      type: numeric
      min: 1
      max: 4

  age_at_first_marriage:
    name: Age at First Marriage
    type: numeric
    domain: Marriage
    allowed:
      type: numeric
      min: 13
      max: 62

  age_at_first_child:
    name: Age at First Child
    type: numeric
    domain: Marriage
    allowed:
      type: numeric
      min: 12
      max: 63      

  age_started_work:
    name: Age Started Work
    type: numeric
    domain: SES
    allowed:
      type: numeric
      min: 13
      max: 65      

  child_number:
    name: Child Number
    type: numeric
    description: Number of children lifetime
    domain: Marriage
    allowed:
      min: 0
      max: 5

  mean_income_30_40:
    type: numeric
    description: Average personal annual income between age 30 to 40
    domain: SES
    allowed:
      type: numeric
      min: 0
      max: 10299996
    log_transform: True

  age_finished_education:
    name: Age Finished Education
    type: numeric
    domain: SES
    allowed:
      type: numeric
      min: 0
      max: 65


# === Predictors (Covariates) ===
predictors:
  highest_education:
    name: Highest Education
    type: categorical
    domain: SES
    allowed:
      - Less than high school
      - High school
      - Some college
      - Bachelor and above
  race:
    type: categorical
    description: ethnic or racial identity
    domain: Demography
    allowed:
      - non-Hispanic white
      - black
      - native american
      - asian
      - hispanic
      - others
  gender:
    type: categorical
    name: "Gender"
    description: Gender
    domain: Demography

# === Interaction Terms ===
include_interactions: false

# === Bootstrap Settings ===
bootstrap_B: 10
alpha: 0.05
bootstrap_sample_ratio: null
bootstrap_sample_n: 500