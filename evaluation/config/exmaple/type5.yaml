# === Input Files ===
real_csv: "/home/yx5888/Workspace/AI4SS_Evaluation_local/Simulated_modified/sampled_inputs_gpt-4_temp1.0_top1.0.csv"
sim_csv:  "/home/yx5888/Workspace/AI4SS_Evaluation_local/Simulated_modified/sim_profiles_gpt-4_temp1.0_top1.0.csv"


# === Output Directory ===
out_dir: "./1111"

# === Event Variables ===
event_variables:
  age_completed_education:
    name: E
  AGE1M:
    name: M
    value_map:
      Never Married: inf
      "": null
  age_at_first_birth:
    name: B
    value_map:
      No Childbearing: inf
      "": null
# === Predictors (Covariates) ===
# Used for all regressions.
predictors:
  immigrant_status:
    type: categorical
  race:
    type: categorical
  gender:
    type: categorical
  educ_35:
    type: categorical
    name: "Education (Age 35)"

  inccat_35:
    type: categorical
    name: "Income Category (Age 35)"

  occ_35:
    type: categorical
    name: "Occupation (Age 35)"


  self_rated_health:
    type: categorical
    name: "Self-rated Health"

  self_rated_memory:
    type: categorical
    name: "Self-rated Memory"

# === Interaction Terms ===
# Whether to include all pairwise predictor interactions
include_interactions: false

# === Bootstrap Settings ===
bootstrap_B: 10        # Number of bootstrap iterations
alpha: 0.05              # Significance level (e.g., 0.05 → 95% CI)
bootstrap_sample_ratio: null  # Sampling ratio per iteration (unused if sample_n is set)
bootstrap_sample_n: 500        # Fixed sample size per bootstrap draw