  age_at_first_marriage:
    name: Age at First Marriage
    type: numeric
    domain: Marriage


  age_at_first_child:
    name: Age at First Child
    type: numeric
    domain: Marriage

  physical_health:
    name: Physical Health
    type: numeric
    domain: Health

  mental_health:
    name: Mental Health
    type: numeric
    domain: Health

  self_rated_general_health:
    name: Self-rated General Health
    type: categorical
    domain: Health


  self_rated_memory:
    name: Self-rated Memory
    type: categorical
    domain: Abilities

  occupation_30_40:
    type: categorical
    name: Occupation (Age 30–40)
    description: Main occupation between age 30 to 40
    domain: SES
    allowed:
      - Managers
      - Professionals
      - Technicians
      - Clerical
      - Service/Sales
      - Agriculture
      - Craft/Trades
      - Machine Operators
      - Elementary
      - Military
