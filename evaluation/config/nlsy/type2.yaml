bootstrap_B: 10
alpha: 0.05
bootstrap_sample_n: 500

variables:

  gender:
    type: categorical
    name: "Gender"
    input: true
    description: Gender
    domain: Demography
    allowed:
      - Female
      - Male 
 
  race:
    type: categorical
    name: "Race"
    input: true
    description: Racial/ethnic Identification
    domain: Demography
    allowed: 
      - Non-Black, Non-Hispanic
      - Hispanic
      - Black

  immigrant_status:
    type: categorical
    name: "Immigrant Status"
    input: true
    description: Immigration Status
    domain: Demography
    allowed: 
      - non-immigrant
      - immigrant

  mother_education:
    type: categorical
    name: "Mother’s Education"
    input: true
    description: Mother's highest education
    domain: Demography
    allowed:
      - Less than high school
      - High school
      - Some college
      - Bachelor and above
  
  father_education:
    type: categorical
    name: "Father’s Education"
    input: true
    description: Father's highest education
    domain: Demography
    allowed:
      - Less than high school
      - High school
      - Some college
      - Bachelor and above

  mean_income_30_40:
    type: numeric
    name: Mean Income (Age 30–40) 
    description: Average personal annual income between age 30 to 40
    domain: SES
    allowed:
      type: numeric
      min: 0
      max: 10299996


  age_finished_education:
    name: Age Finished Education
    type: numeric
    domain: SES

  age_started_work:
    name: Age Started Work
    type: numeric
    domain: SES


  child_number:
