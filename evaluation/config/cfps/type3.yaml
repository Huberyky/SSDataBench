# === Output Directory ===
out_dir: "./1111"

# === Model Types ===
# One model type per response variable.
#   ols     → linear regression (continuous outcome)
#   logit   → logistic regression (binary outcome)
#   mnlogit → multinomial logistic regression (categorical outcome)
model_type:
  - ols
  - ols
  - ols
  - ols
  - ols
  - ols
  - ols
  - ols
  - ols
  - ols
  - ols
# === Response Variables ===
# Each variable can specify:
#   name: friendly display name (used in plots or summaries)
#   type: "numeric" or "categorical"
#   value_map: optional dictionary to map labels to numbers
#   drop_values: optional list of invalid values to exclude
response:


  age_at_first_marriage:
    name: Age at First Marriage
    type: numeric
    description: Age first got married
    domain: Marriage
    allowed:
      min: 21
      max: 78

  age_at_first_child:
    name: Age at First Child
    type: numeric
    description: Age at first childbirth
    domain: Marriage
    allowed:
      min: 21
      max: 66

  age_finished_education:
    name: Age Finished Education
    type: numeric
    description: Age finished education
    domain: SES
    allowed:
      min: 6
      max: 63

  age_started_work:
    name: Age Started Work
    type: numeric
    description: Age started work
    domain: SES
    allowed:
      min: 10
      max: 80

  gender_role:
    name: Gender Role
    type: numeric
    description: Belief about traditional gender roles; higher score indicates stronger traditional gender norms
    domain: Attitude
    allowed:
      min: -3
      max: 1
  mean_income_30_40:
    type: numeric
    description: Average personal annual income between age 30 to 40
    domain: SES
    allowed:
      type: numeric
      min: 0
      max: 10299996
  fixed_mindset:
    name: Fixed Mindset
    type: numeric
