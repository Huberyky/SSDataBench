    domain: Ability
    allowed:
      min: 1
      max: 5

  growth_mindset:
    name: Growth Mindset
    type: numeric
    description: Belief that abilities can be developed; higher scores indicate stronger belief in malleability of ability
    domain: Ability
    allowed:
      min: 1
      max: 5

  math_cognitive:
    name: Math Cognitive Ability
    type: numeric
    description: Mathematical reasoning and problem-solving ability
    domain: Ability
    allowed:
      min: 0
      max: 24

  verbal_cognitive:
    name: Verbal Cognitive Ability
    type: numeric
    description: Verbal comprehension and reasoning ability
    domain: Ability
    allowed:
      min: 0
      max: 34

  self_control:
    name: Self Control
    type: numeric
    description: Self-control and emotional regulation ability
    domain: Ability
    allowed:
      min: -5
      max: 3
# === Predictors (Covariates) ===
predictors:
  highest_education:
    name: Highest Education
    type: categorical
    domain: SES
    allowed:
      - Less than high school
      - High school
      - Some college
      - Bachelor and above
  minzu:
    name: Minzu
    type: categorical
    input: true
    description: Ethnic or racial identity
    domain: Demography
    allowed:
      - han
      - minority
  gender:
    type: categorical
    name: "Gender"
    description: Gender
    domain: Demography

# === Interaction Terms ===
include_interactions: false

# === Bootstrap Settings ===
bootstrap_B: 10
alpha: 0.05
bootstrap_sample_ratio: null
bootstrap_sample_n: 500